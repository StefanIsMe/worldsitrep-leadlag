name: Daily lead-lag update

# Retired from the schedule in November 2026. This was the first single-market
# prototype (EU military flights against one Ukraine ceasefire market). The
# Signal Ledger (ledger.yml) now tests every signal against every market, and
# the site reads only ledger/. The prototype's flight archive months return
# 404 and its Polymarket endpoint 410, so the daily run failed every day.
# It can still be started by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leadlag-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - name: Update signals + market + analysis
        env:
          LEADLAG_PAT: ${{ secrets.LEADLAG_PAT }}
        run: python update.py
      - name: Commit results
        shell: bash
        run: |
          git add -- signals market.csv result.json chart.png
          git diff --cached --quiet && echo "no change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: daily lead-lag update"
          git push
